<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>luanti-viewer demo</title>
    <link rel="icon" href="data:,">
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #1b1d21;
            font: 13px/1.4 system-ui, sans-serif;
        }
        #view {
            width: 100%;
            height: 100%;
        }
        nav {
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            z-index: 1;
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 4px;
            pointer-events: none;
        }
        nav > * {
            pointer-events: auto;
            white-space: nowrap;
        }
        nav a {
            padding: 4px 10px;
            border-radius: 4px;
            color: #fff;
            background: rgba(0, 0, 0, .55);
            text-decoration: none;
        }
        nav label {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 4px;
            color: #fff;
            background: rgba(0, 0, 0, .55);
        }
        nav select {
            font: inherit;
        }
        nav input:not([type]), nav input[type=number] {
            font: inherit;
        }
        nav input[list] {
            width: 220px;
        }
        nav input[type=number] {
            width: 56px;
        }
        nav button {
            font: inherit;
            padding: 0 6px;
        }
        nav [hidden] {
            display: none;
        }
        nav a.active {
            background: rgba(255, 255, 255, .9);
            color: #000;
        }
    </style>
</head>
<body>
    <nav>
        <a href="./" id="link-export">exported map</a>
        <a href="./?scene=showcase" id="link-showcase">drawtype showcase</a>
        <a href="./?scene=node" id="link-node">node viewer</a>
        <label id="node-controls" hidden>
            <button type="button" id="node-prev" title="previous node">&#9664;</button>
            <input id="node-name" list="node-names" spellcheck="false" autocomplete="off">
            <button type="button" id="node-next" title="next node">&#9654;</button>
            param2 <input type="number" id="node-param2" min="0" max="255" placeholder="auto">
            rotate <input type="checkbox" id="node-rotate">
        </label>
        <datalist id="node-names"></datalist>
        <label id="export-controls" hidden>
            <select id="export-mode" title="baked: looks like the viewer, raw: lit by the renderer (e.g. Cycles)">
                <option value="baked">baked light</option>
                <option value="raw">raw (no light)</option>
            </select>
            <button type="button" id="export-button" title="export the loaded mapblocks as glTF (.glb), e.g. for blender">export .glb</button>
        </label>
        <label>time of day <input type="range" id="time" min="0" max="1" step="0.005" value="0.5"></label>
    </nav>
    <div id="view"></div>
    <script type="module" src="./main.ts"></script>
</body>
</html>
